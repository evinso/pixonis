  <script>
    const tl = gsap.timeline({ paused: true });
    const REST = { c1: -4, c2: 6, c3: -7, c4: 5, c5: -6, c6: 3 };
    const AIR = "0 40px 60px rgba(0,0,0,0.35)";
    const LAND = "0 8px 14px rgba(0,0,0,0.22)";

    // frame 0 is the thumbnail: set 1, its price and the hook are already resting
    tl.set("#pile-c1", { rotation: REST.c1 }, 0);
    tl.set("#pile-p1-st", { rotation: -6 }, 0);
    // the camera opens tight on set 1 (the thumbnail), then pulls back as the pile grows
    tl.set("#pile-cam", { scale: 1.45, x: 220, y: 290 }, 0);
    tl.to("#pile-cam", { scale: 1, x: 0, y: 0, duration: 1.6, ease: "power2.inOut" }, 0.7);

    // a print falls onto the mat (a fall speeds up), then settles
    function slap(id, t) {
      tl.fromTo(
        id,
        { scale: 1.32, y: -160, rotation: REST[id.slice(-2)] + 9, boxShadow: AIR },
        { scale: 1, y: 0, rotation: REST[id.slice(-2)], boxShadow: LAND, duration: 0.3, ease: "power3.in" },
        t,
      );
      tl.to(id, { scale: 0.985, duration: 0.05, ease: "none" }, t + 0.3);
      tl.to(id, { scale: 1, duration: 0.12, ease: "power2.out" }, t + 0.35);
    }
    // a print tossed in from the side
    function toss(id, t, fromX) {
      tl.fromTo(
        id,
        { x: fromX, y: -60, scale: 1.12, rotation: REST[id.slice(-2)] + (fromX < 0 ? -24 : 24), boxShadow: AIR },
        { x: 0, y: 0, scale: 1, rotation: REST[id.slice(-2)], boxShadow: LAND, duration: 0.32, ease: "power3.in" },
        t,
      );
      tl.to(id, { scale: 0.985, duration: 0.05, ease: "none" }, t + 0.32);
      tl.to(id, { scale: 1, duration: 0.12, ease: "power2.out" }, t + 0.37);
    }
    // the old price sticker is peeled off and thrown up-right
    function peel(id, t, rot) {
      tl.to(id, { x: 260, y: -320, scale: 1.08, rotation: rot - 28, duration: 0.28, ease: "power3.in" }, t);
    }
    // a new price sticker is slapped on
    function stick(id, t, rot) {
      tl.fromTo(id, { scale: 1.35, rotation: rot + 10 }, { scale: 1, rotation: rot, duration: 0.22, ease: "power3.in" }, t);
      tl.to(id, { scale: 0.97, duration: 0.04, ease: "none" }, t + 0.22);
      tl.to(id, { scale: 1, duration: 0.12, ease: "power2.out" }, t + 0.26);
    }
    function wordsIn(sel, t) {
      tl.fromTo(
        sel + " .w",
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" },
        t,
      );
    }
    function wordsOut(sel, t) {
      tl.to(sel + " .w", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, t);
    }

    // 1 set → 2 sets: 39,90 peels, 37,90 lands
    slap("#pile-c2", 0.7);
    peel("#pile-p1-st", 0.95, -6);
    stick("#pile-p2-st", 1.0, 5);
    wordsOut("#pile-t1", 0.95);
    wordsIn("#pile-t2", 1.05);

    // sets 3 and 4: the count rolls
    slap("#pile-c3", 1.2);
    tl.fromTo("#pile-p2-strip", { y: 0 }, { y: -40, duration: 0.1, ease: "power2.out" }, 1.5);
    slap("#pile-c4", 1.7);
    tl.to("#pile-p2-strip", { y: -80, duration: 0.1, ease: "power2.out" }, 2.0);

    // payoff: set 5 tossed in, 37,90 peels, pink 35,90 lands, camera punch
    toss("#pile-c5", 2.68, 760);
    wordsOut("#pile-t2", 2.95);
    peel("#pile-p2-st", 2.98, 5);
    stick("#pile-p3-st", 3.0, -4);
    tl.to("#pile-cam", { scale: 1.05, duration: 0.35, ease: "expo.out" }, 3.22);
    wordsIn("#pile-t3", 3.1);

    // set 6
    toss("#pile-c6", 3.3, -760);
    tl.fromTo("#pile-p3-strip", { y: 0 }, { y: -40, duration: 0.1, ease: "power2.out" }, 3.62);

    wordsOut("#pile-t3", 5.0);
    wordsIn("#pile-t4", 5.1);
    wordsOut("#pile-t4", 6.75);

    // the pile is swept off the mat, downward
    tl.to(
      ["#pile-p3-st", "#pile-c6", "#pile-c5", "#pile-c4", "#pile-c3", "#pile-c2", "#pile-c1"],
      { y: "+=1500", rotation: "+=14", duration: 0.4, stagger: 0.04, ease: "power3.in" },
      6.8,
    );

    window.__timelines["pile"] = tl;
  </script>
