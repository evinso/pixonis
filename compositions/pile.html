  <script>
    // The narration is the clock: one Eleven v4 take (Laura) split at two silences, see index.html.
    const tl = gsap.timeline({ paused: true });
    const REST = { c1: -4, c2: 6, c3: -7, c4: 5, c5: -6 };
    const AIR = "0 40px 60px rgba(0,0,0,0.35)";
    const LAND = "0 8px 14px rgba(0,0,0,0.22)";

    // ---- baselines (frame 0 is the thumbnail: the Van Gogh sheet up close, mid-shine)
    tl.set("#pile-c1", { rotation: REST.c1 }, 0);
    tl.set("#pile-cam", { scale: 1.5, x: 220, y: 270 }, 0);
    tl.set(["#pile-b2", "#pile-b3", "#pile-b4", "#pile-b5"], { xPercent: -160 }, 0);
    tl.set("#pile-cut", { transformPerspective: 700, transformOrigin: "50% 100%" }, 0);

    function gloss(id, t, dur) {
      tl.fromTo(id, { xPercent: -160 }, { xPercent: 300, duration: dur || 0.7, ease: "power1.inOut" }, t);
    }
    function slap(id, t) {
      const r = REST[id.slice(-2)];
      tl.fromTo(
        id,
        { scale: 1.32, y: -160, rotation: r + 9, boxShadow: AIR },
        { scale: 1, y: 0, rotation: r, boxShadow: LAND, duration: 0.3, ease: "power3.in" },
        t,
      );
      tl.to(id, { scale: 0.985, duration: 0.05, ease: "none" }, t + 0.3);
      tl.to(id, { scale: 1, duration: 0.12, ease: "power2.out" }, t + 0.35);
    }
    function toss(id, t, fromX) {
      const r = REST[id.slice(-2)];
      tl.fromTo(
        id,
        { x: fromX, y: -60, scale: 1.12, rotation: r + (fromX < 0 ? -24 : 24), boxShadow: AIR },
        { x: 0, y: 0, scale: 1, rotation: r, boxShadow: LAND, duration: 0.32, ease: "power3.in" },
        t,
      );
      tl.to(id, { scale: 0.985, duration: 0.05, ease: "none" }, t + 0.32);
      tl.to(id, { scale: 1, duration: 0.12, ease: "power2.out" }, t + 0.37);
    }
    function peelOff(id, t, rot) {
      tl.to(id, { x: 260, y: -320, scale: 1.08, rotation: rot - 28, duration: 0.28, ease: "power3.in" }, t);
    }
    function stick(id, t, rot, from) {
      tl.fromTo(id, { scale: from || 1.35, rotation: rot + 10 }, { scale: 1, rotation: rot, duration: 0.22, ease: "power3.in" }, t);
      tl.to(id, { scale: 0.97, duration: 0.04, ease: "none" }, t + 0.22);
      tl.to(id, { scale: 1, duration: 0.12, ease: "power2.out" }, t + 0.26);
    }
    function pop(sel, t) {
      tl.to(sel, { scale: 1.28, rotation: -7, duration: 0.12, ease: "power2.out" }, t);
      tl.to(sel, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(2)" }, t + 0.12);
    }
    function dot(sel, t) {
      tl.fromTo(sel, { scale: 0, rotation: -10, opacity: 0 }, { scale: 1, rotation: 6, opacity: 1, duration: 0.22, ease: "back.out(2.2)" }, t);
    }
    function wordsIn(sel, t) {
      tl.fromTo(
        sel + " .w",
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" },
        t,
      );
    }
    function wordsOut(sel, t) {
      tl.to(sel + " .w", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, t);
    }
    function tagIn(id, t, rot) {
      tl.fromTo(id, { scale: 1.4, rotation: rot + 8 }, { scale: 1, rotation: rot, duration: 0.2, ease: "power3.in" }, t);
      tl.to(id, { scale: 0.97, duration: 0.04, ease: "none" }, t + 0.2);
      tl.to(id, { scale: 1, duration: 0.12, ease: "power2.out" }, t + 0.24);
    }
    function tagOut(id, t) {
      tl.to(id, { scale: 0.85, opacity: 0, filter: "blur(6px)", duration: 0.18, ease: "power2.in" }, t);
    }

    // ---- 1 · quality close-up (VO part 1 at 0.20: "Şu kaliteye bir bak! Parlak ve mat fotoğraf kâğıtlarına basıyoruz,
    //      kendi ekipmanlarımızla hassasça kesiyoruz.")
    tl.fromTo("#pile-b1", { xPercent: -60 }, { xPercent: 300, duration: 1.1, ease: "power1.inOut" }, 0); // shine on "kaliteye"
    tl.to("#pile-cam", { scale: 1.75, x: 232, y: 291, duration: 2.2, ease: "power2.inOut" }, 1.7); // push in on "Parlak"
    tagIn("#pile-q1", 1.72, -4);
    gloss("#pile-b1", 2.95, 0.9); // light again on "kâğıtlarına"
    // the portrait sticker peels off on "hassasça" (5.97), free on "kesiyoruz" (6.43)
    tl.to(
      "#pile-cut",
      { rotationX: -38, scale: 1.08, filter: "drop-shadow(0px 14px 12px rgba(0,0,0,0.28))", duration: 0.4, ease: "power2.out" },
      5.93,
    );
    tl.to(
      "#pile-cut",
      { rotationX: 0, y: -80, scale: 1.5, rotation: 6, filter: "drop-shadow(0px 34px 26px rgba(0,0,0,0.32))", duration: 0.45, ease: "power3.out" },
      6.33,
    );
    tagIn("#pile-q2", 6.4, 3);
    wordsOut("#pile-t1", 7.25);
    tagOut("#pile-q1", 7.28);
    tagOut("#pile-q2", 7.3);
    // the sticker is carried away as the camera pulls back to the mat
    tl.to("#pile-cut", { x: 260, y: -1100, rotation: 28, scale: 1.7, duration: 0.5, ease: "power3.in" }, 7.4);
    tl.to("#pile-cam", { scale: 1, x: 0, y: 0, duration: 1.2, ease: "power2.inOut" }, 7.35);
    tl.to("#pile-hole", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 7.75);

    // ---- 2 · variety (VO part 2 at 7.75: "Van Gogh'tan kawaii'ye, her tarzda setimiz var. ...")
    tl.fromTo("#pile-drift", { rotation: 0, x: 0 }, { rotation: 1.2, x: -14, duration: 7.96, ease: "sine.inOut" }, 8.55);
    pop("#pile-g1", 7.955); // "Gogh'tan"
    slap("#pile-c2", 8.24); // Kawaii lands on "kawaii'ye" (8.54)
    gloss("#pile-b2", 8.615);
    slap("#pile-c3", 8.93); // "her"
    gloss("#pile-b3", 9.31);
    wordsIn("#pile-t2", 9.385); // "tarzda"
    slap("#pile-c4", 9.67); // "setimiz"
    gloss("#pile-b4", 10.045);
    stick("#pile-p1-st", 10.265, -6); // A5 · 64,90 on "var"
    wordsOut("#pile-t2", 10.79);

    // ---- 3 · the offer: "Üstelik şimdi beş (12.07) al, dört öde... beşinci (13.52) set bizden, bedava (14.97)!"
    peelOff("#pile-p1-st", 11.825, -6);
    stick("#pile-p2-st", 11.845, 5);
    dot("#pile-d1", 12.19); // counting 1-2-3-4 over "al, dört öde"
    dot("#pile-d2", 12.5);
    dot("#pile-d3", 12.67);
    dot("#pile-d4", 12.84);
    toss("#pile-c5", 13.2, 760); // the 5th set lands on "beşinci"
    dot("#pile-d5", 14.035);
    tl.fromTo(
      "#pile-free",
      { scale: 1.6, rotation: -2, opacity: 0 },
      { scale: 1, rotation: -12, opacity: 1, duration: 0.22, ease: "power3.in" },
      14.745,
    );
    tl.to("#pile-free", { scale: 0.96, duration: 0.04, ease: "none" }, 14.965);
    tl.to("#pile-free", { scale: 1, duration: 0.14, ease: "power2.out" }, 15.005);
    tl.to("#pile-cam", { scale: 1.05, x: -20, y: -12, duration: 0.35, ease: "expo.out" }, 14.965);
    gloss("#pile-b5", 15.075);
    ["#pile-b1", "#pile-b2", "#pile-b3", "#pile-b4"].forEach((b, i) => gloss(b, 15.395 + i * 0.09, 0.6));

    // ---- the pile is swept off the mat, downward
    tl.to(
      ["#pile-p2-st", "#pile-c5", "#pile-c4", "#pile-c3", "#pile-c2", "#pile-c1"],
      { y: "+=1500", rotation: "+=14", duration: 0.4, stagger: 0.03, ease: "power3.in" },
      15.96,
    );

    window.__timelines["pile"] = tl;
  </script>
