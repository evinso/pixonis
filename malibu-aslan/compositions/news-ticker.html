<!-- hyperframes-registry-item: news-ticker -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>News Ticker</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }

      body {
        font-family: "Nunito", sans-serif;
      }

      #nt-root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        color: #f8fafc;
        background: transparent;
      }

      #nt-root .nt-shell {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 640px;
        height: 236px;
        filter: drop-shadow(0 28px 44px rgba(0, 0, 0, 0.32));
      }

      #nt-root .nt-panel {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 28px;
        background:
          linear-gradient(180deg, rgba(41, 49, 75, 0.97), rgba(26, 31, 50, 0.98)),
          linear-gradient(90deg, rgba(225, 168, 164, 0.6), transparent 38%);
      }

      #nt-root .nt-panel::before {
        position: absolute;
        inset: 0;
        content: "";
        background:
          radial-gradient(circle at 14% 0%, rgba(255, 255, 255, 0.2), transparent 26%),
          linear-gradient(
            110deg,
            transparent 0 42%,
            rgba(255, 255, 255, 0.06) 42% 43%,
            transparent 43% 100%
          );
        opacity: 0.72;
        pointer-events: none;
      }

      #nt-root .nt-top-row {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 140px;
        display: flex;
        align-items: stretch;
      }

      #nt-root .nt-brand {
        width: 214px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: linear-gradient(135deg, #e1a8a4, #c98580);
        color: #29314b;
        box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.16);
      }

      #nt-root .nt-live-dot {
        width: 16px;
        height: 16px;
        border-radius: 999px;
        background: #29314b;
        box-shadow: 0 0 0 0 rgba(41, 49, 75, 0.55);
      }

      #nt-root .nt-brand-text {
        display: flex;
        flex-direction: column;
        gap: 4px;
        text-transform: uppercase;
      }

      #nt-root .nt-live {
        font-size: 30px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0.1em;
      }

      #nt-root .nt-desk {
        font-size: 28px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0.12em;
        color: #29314b;
      }

      #nt-root .nt-headline-wrap {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        padding: 0 24px 0 26px;
        overflow: hidden;
      }

      #nt-root .nt-headline {
        position: relative;
        z-index: 1;
        font-size: 44px;
        font-weight: 900;
        line-height: 1.08;
        letter-spacing: 0;
        white-space: normal;
        color: #ffffff;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.34);
      }

      #nt-root .nt-headline-accent {
        color: #e8bcac;
      }

      #nt-root .nt-time {
        display: none;
        position: absolute;
        top: 25px;
        right: 38px;
        padding: 10px 16px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.74);
        font-size: 18px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.08em;
        font-variant-numeric: tabular-nums;
      }

      #nt-root .nt-bottom-row {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 96px;
        display: flex;
        align-items: center;
        border-top: 1px solid rgba(255, 255, 255, 0.11);
        background: rgba(2, 6, 13, 0.58);
      }

      #nt-root .nt-label {
        width: 214px;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        border-right: 1px solid rgba(255, 255, 255, 0.14);
        background: #e1a8a4;
        color: #29314b;
        font-size: 30px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0.04em;
      }

      #nt-root .nt-ticker-window {
        position: relative;
        flex: 1;
        height: 100%;
        overflow: hidden;
        background: #1a1f32;
      }

      #nt-root .nt-ticker-window::before,
      #nt-root .nt-ticker-window::after {
        position: absolute;
        top: 0;
        bottom: 0;
        z-index: 2;
        width: 90px;
        content: "";
        pointer-events: none;
      }

      #nt-root .nt-ticker-window::before {
        left: 0;
        background: linear-gradient(90deg, #1a1f32, transparent);
      }

      #nt-root .nt-ticker-window::after {
        right: 0;
        background: linear-gradient(270deg, #1a1f32, transparent);
      }

      #nt-root .nt-ticker-track {
        position: absolute;
        left: 34px;
        top: 0;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 34px;
        white-space: nowrap;
        will-change: transform;
      }

      #nt-root .nt-item {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 13px 18px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        background: #29314b;
        color: #ffffff;
        font-size: 30px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0;
      }

      #nt-root .nt-separator {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: #e1a8a4;
        box-shadow: 0 0 22px rgba(225, 168, 164, 0.75);
      }

      #nt-root .nt-metric {
        padding: 4px 8px;
        border-radius: 8px;
        background: #063344;
        color: #c8f8ff;
        font-weight: 850;
        font-variant-numeric: tabular-nums;
      }

      #nt-root .nt-flash {
        position: absolute;
        top: 0;
        bottom: 0;
        left: -260px;
        z-index: 3;
        width: 210px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
        transform: skewX(-16deg);
      }
    </style>
  </head>
  <body>
    <div
      id="nt-root"
      data-composition-id="news-ticker"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="2.6"
    >
      <section
        id="nt-shell"
        class="clip nt-shell"
        data-start="0"
        data-duration="2.6"
        data-track-index="0"
      >
        <div class="nt-panel">
          <div id="nt-flash" class="nt-flash"></div>
          <div class="nt-top-row">
            <div id="nt-brand" class="nt-brand">
              <div id="nt-live-dot" class="nt-live-dot"></div>
              <div class="nt-brand-text">
                <div class="nt-live">MALIBU</div>
                <div class="nt-desk">HABER</div>
              </div>
            </div>
            <div class="nt-headline-wrap">
              <h1 id="nt-headline" class="nt-headline">
                Kaçan aslan <span class="nt-headline-accent">Malibu Craft'ta</span> görüldü!
              </h1>
              <div id="nt-time" class="nt-time">03:14</div>
            </div>
          </div>
          <div class="nt-bottom-row">
            <div id="nt-label" class="nt-label">SON DAKİKA</div>
            <div class="nt-ticker-window">
              <div id="nt-ticker-track" class="nt-ticker-track" data-layout-allow-occlusion>
                <span class="nt-item" data-layout-allow-occlusion><span class="nt-separator"></span>Görgü tanıkları: Gözü stickerlardaydı</span>
                <span class="nt-item" data-layout-allow-occlusion><span class="nt-separator"></span>Van Gogh setinden ayrılamadı</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      var tl = gsap.timeline({ paused: true });
      var shell = document.getElementById("nt-shell");
      var brand = document.getElementById("nt-brand");
      var headline = document.getElementById("nt-headline");
      var label = document.getElementById("nt-label");
      var tickerTrack = document.getElementById("nt-ticker-track");
      var liveDot = document.getElementById("nt-live-dot");
      var flash = document.getElementById("nt-flash");
      var time = document.getElementById("nt-time");

      // Malibu edit: the banner is complete at frame 0 (it is the hook), the crawl runs, the banner leaves at 2.3 s.
      tl.to(flash, { x: 1400, duration: 0.8, ease: "power2.inOut" }, 0.2);
      tl.fromTo(tickerTrack, { x: 0 }, { x: -380, duration: 2.4, ease: "none" }, 0);
      tl.to(liveDot, { scale: 1.32, duration: 0.42, repeat: 4, yoyo: true, ease: "sine.inOut" }, 0);
      tl.to(shell, { y: 330, opacity: 0, duration: 0.3, ease: "power3.in" }, 2.3);

      window.__timelines["news-ticker"] = tl;
    </script>
  </body>
</html>
